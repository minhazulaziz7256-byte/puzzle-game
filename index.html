<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Puzzle Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 Memory Puzzle Game</h1>
            <div class="info">
                <div class="score-box">
                    <span class="label">Score:</span>
                    <span class="value" id="score">0</span>
                </div>
                <div class="moves-box">
                    <span class="label">Moves:</span>
                    <span class="value" id="moves">0</span>
                </div>
                <div class="timer-box">
                    <span class="label">Time:</span>
                    <span class="value" id="timer">0s</span>
                </div>
            </div>
        </div>

        <div class="game-board" id="gameBoard">
            <!-- Cards will be generated by JavaScript -->
        </div>

        <div class="controls">
            <button class="btn btn-start" id="startBtn">🎯 Start Game</button>
            <button class="btn btn-reset" id="resetBtn">🔄 Reset</button>
            <button class="btn btn-easy" id="easyBtn">Easy (4x4)</button>
            <button class="btn btn-hard" id="hardBtn">Hard (6x6)</button>
        </div>

        <div class="modal" id="modal">
            <div class="modal-content">
                <h2>🎉 Congratulations!</h2>
                <p>You completed the puzzle!</p>
                <div class="final-stats">
                    <p>Score: <span id="finalScore">0</span></p>
                    <p>Moves: <span id="finalMoves">0</span></p>
                    <p>Time: <span id="finalTime">0</span>s</p>
                </div>
                <button class="btn btn-play-again" id="playAgainBtn">Play Again</button>
            </div>
        </div>

        <div class="difficulty-selector">
            <h3>Select Difficulty:</h3>
            <button class="difficulty-btn active" data-difficulty="easy">Easy (4x4)</button>
            <button class="difficulty-btn" data-difficulty="normal">Normal (4x6)</button>
            <button class="difficulty-btn" data-difficulty="hard">Hard (6x6)</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
